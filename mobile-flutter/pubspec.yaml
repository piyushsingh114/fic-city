name: fic_city
description: "Fic City - Civic Complaint & Municipal Resolution System (MCD 311)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  image_picker: ^1.0.7
  speech_to_text: ^6.6.0
  flutter_secure_storage: ^9.0.0
  intl: ^0.19.0
  lucide_icons: ^0.259.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
